[project]
name = "syncfuzz"
version = "0.1.0"
description = "Rollback-schedule fuzzing for agent belief-state divergence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
